<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird</title>
    <!-- This meta tag is the fix for the zoom problem -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            /* This CSS rule helps prevent unwanted scrolling/zooming on touch */
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="board" width="360" height="640"></canvas>
    <script src="flappybird.js"></script>
</body>
</html>
